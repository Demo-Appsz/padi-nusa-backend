[package]
name = "padinusa-backend"
version = "0.1.0"
edition = "2021"
description = "PadiNusa Artisanal Rice Store backend in DDD & Hexagonal Architecture"

[lib]
name = "padinusa_backend"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "padinusa-server"
path = "src/bin/server.rs"
required-features = ["vps"]

[features]
default = ["vps"]
vps = ["dep:axum", "dep:tokio", "dep:tower-http"]
cloudflare = ["dep:worker"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "js", "serde"] }

# VPS / Container Adapter (Axum + Tokio)
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.6", features = ["cors", "trace"], optional = true }

# Cloudflare Workers Adapter (WASM)
worker = { version = "0.8.7", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[build-dependencies]
syn = { version = "2", features = ["full"] }
